spring:
  application:
    name: mock-interview-backend
  profiles:
    active: ${SPRING_PROFILE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/mockinterview?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:mockuser}
    password: ${DB_PASSWORD:mockpass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    ignore-migration-patterns: "*:missing"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cache:
    type: redis

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-must-be-at-least-256-bits-long-for-hs256}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}
  sandbox:
    docker-host: ${DOCKER_HOST:npipe:////./pipe/docker_engine}
    java-image: ${SANDBOX_JAVA_IMAGE:eclipse-temurin:21-jdk-alpine}
    timeout-seconds: ${SANDBOX_TIMEOUT_SECONDS:10}
    memory-bytes: ${SANDBOX_MEMORY_BYTES:268435456}
    cpu-period: 100000
    cpu-quota: 50000
    workspace-base: ${SANDBOX_WORKSPACE:C:/tmp/sandbox}
    workspace-volume: ${SANDBOX_WORKSPACE_VOLUME:mockinterview-sandbox-workspace}
    worker-url: ${SANDBOX_WORKER_URL:http://localhost:8081}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models/}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
  scoring:
    weights:
      coding: 0.40
      knowledge: 0.20
      communication: 0.20
      behavior: 0.20
    coding-weights:
      correctness: 0.40
      time-efficiency: 0.15
      space-efficiency: 0.10
      code-quality: 0.15
      robustness: 0.10
      readability: 0.10
    thresholds:
      beginner-max: 39
      developing-max: 59
      intermediate-max: 74
      advanced-max: 89

logging:
  level:
    com.mockinterview: DEBUG
    org.springframework.security: INFO
