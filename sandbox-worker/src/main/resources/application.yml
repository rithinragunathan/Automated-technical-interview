server:
  port: 8081
app:
  sandbox:
    java-image: ${SANDBOX_JAVA_IMAGE:eclipse-temurin:21-jdk-alpine}
    timeout-seconds: ${SANDBOX_TIMEOUT_SECONDS:10}
    memory-bytes: ${SANDBOX_MEMORY_BYTES:268435456}
    cpu-period: 100000
    cpu-quota: 50000
    workspace-base: ${SANDBOX_WORKSPACE:/tmp/sandbox}
    workspace-volume: ${SANDBOX_WORKSPACE_VOLUME:mockinterview-sandbox-workspace}
    pid-limit: 50
