version: '3.8'

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mockinterview}
      MYSQL_USER: ${MYSQL_USER:-mockuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mockpass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - interview-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - interview-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  sandbox-worker:
    build:
      context: ./sandbox-worker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox_workspace:/tmp/sandbox
    environment:
      - SANDBOX_JAVA_IMAGE=${SANDBOX_JAVA_IMAGE:-eclipse-temurin:21-jdk-alpine}
      - SANDBOX_TIMEOUT_SECONDS=${SANDBOX_TIMEOUT_SECONDS:-10}
      - SANDBOX_MEMORY_BYTES=${SANDBOX_MEMORY_BYTES:-268435456}
      - SANDBOX_WORKSPACE=${SANDBOX_WORKSPACE:-/tmp/sandbox}
      - SANDBOX_WORKSPACE_VOLUME=${SANDBOX_WORKSPACE_VOLUME:-mockinterview-sandbox-workspace}
    networks:
      - interview-net

  backend:
    build:
      context: ./backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox-worker:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${DB_URL:-jdbc:mysql://mysql:3306/mockinterview?createDatabaseIfNotExist=true&serverTimezone=UTC}
      - DB_USERNAME=${DB_USERNAME:-mockuser}
      - DB_PASSWORD=${DB_PASSWORD:-mockpass}
      - JWT_SECRET=${JWT_SECRET:-dev_secret_change_this_to_a_32_byte_value}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - SPRING_PROFILE=${SPRING_PROFILE:-dev}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/models/}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - SANDBOX_JAVA_IMAGE=${SANDBOX_JAVA_IMAGE:-eclipse-temurin:21-jdk-alpine}
      - SANDBOX_WORKSPACE_VOLUME=${SANDBOX_WORKSPACE_VOLUME:-mockinterview-sandbox-workspace}
      - SANDBOX_WORKER_URL=${SANDBOX_WORKER_URL:-http://sandbox-worker:8081}
    networks:
      - interview-net

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    networks:
      - interview-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - interview-net

networks:
  interview-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  sandbox_workspace:
    name: ${SANDBOX_WORKSPACE_VOLUME:-mockinterview-sandbox-workspace}
