version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mockinterview
      POSTGRES_USER: mockuser
      POSTGRES_PASSWORD: mockpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - interview-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mockuser -d mockinterview"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - interview-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  sandbox-worker:
    build:
      context: ./sandbox-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - SANDBOX_JAVA_IMAGE=${SANDBOX_JAVA_IMAGE:-openjdk:21-alpine}
      - SANDBOX_TIMEOUT_SECONDS=${SANDBOX_TIMEOUT_SECONDS:-10}
      - SANDBOX_MEMORY_BYTES=${SANDBOX_MEMORY_BYTES:-268435456}
      - SANDBOX_WORKSPACE=${SANDBOX_WORKSPACE:-/tmp/sandbox}
    networks:
      - interview-net

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox-worker:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${DB_URL:-jdbc:postgresql://postgres:5432/mockinterview}
      - DB_USERNAME=${DB_USERNAME:-mockuser}
      - DB_PASSWORD=${DB_PASSWORD:-mockpass}
      - JWT_SECRET=${JWT_SECRET:-dev_secret}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - SPRING_PROFILE=${SPRING_PROFILE:-dev}
      - AI_PROVIDER=${AI_PROVIDER:-mock}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SANDBOX_WORKER_URL=${SANDBOX_WORKER_URL:-http://sandbox-worker:8081}
    networks:
      - interview-net

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    networks:
      - interview-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - interview-net

networks:
  interview-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
